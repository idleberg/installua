# FileFunc.nsh, ships with NSIS: <https://nsis.sourceforge.io/Docs/AppendixE.html#E.1>.
#
# See docs/header-reference.md.
#
# `locate` and `getDrives` take a callback: `params` says only that a function
# goes there, and the register map is behaviour, in `src/lower/callback.rs`.

