# Dialer, ships with NSIS: <https://nsis.sourceforge.io/Dialer_plug-in>.
#
# See docs/plugin-reference.md.

[[plugin]]
name = "Dialer"
method = "attemptConnect"
nsis = "Dialer::AttemptConnect"
params = []
outputs = ["string"]

[[plugin]]
name = "Dialer"
method = "getConnectedState"
nsis = "Dialer::GetConnectedState"
params = []
outputs = ["string"]

[[plugin]]
name = "Dialer"
method = "autodialOnline"
nsis = "Dialer::AutodialOnline"
params = []
outputs = ["string"]

[[plugin]]
name = "Dialer"
method = "autodialUnattended"
nsis = "Dialer::AutodialUnattended"
params = []
outputs = ["string"]

[[plugin]]
name = "Dialer"
method = "autodialHangup"
nsis = "Dialer::AutodialHangup"
params = []
outputs = ["string"]
