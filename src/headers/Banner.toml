# Banner, ships with NSIS: <https://nsis.sourceforge.io/Banner_plug-in>.
#
# See docs/plugin-reference.md.
#
# Absent: the `/set` form of `show` — a repeated flag pair is not a fixed arity.

[[plugin]]
name = "Banner"
method = "show"
nsis = "Banner::show"
params = ["string"]
outputs = []

[[plugin]]
name = "Banner"
method = "getWindow"
nsis = "Banner::getWindow"
params = []
outputs = ["handle"]

[[plugin]]
name = "Banner"
method = "destroy"
nsis = "Banner::destroy"
params = []
outputs = []
