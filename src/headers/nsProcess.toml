# nsProcess, third-party: <https://nsis.sourceforge.io/NsProcess_plugin>.
#
# See docs/plugin-reference.md.
#
# Absent: `_Unload`, which exists for `/NOUNLOAD` callers; Installua emits no
# `/NOUNLOAD`.

[[plugin]]
name = "nsProcess"
method = "findProcess"
nsis = "nsProcess::_FindProcess"
params = ["string"]
outputs = ["uint"]

[[plugin]]
name = "nsProcess"
method = "killProcess"
nsis = "nsProcess::_KillProcess"
params = ["string"]
outputs = ["uint"]

[[plugin]]
name = "nsProcess"
method = "closeProcess"
nsis = "nsProcess::_CloseProcess"
params = ["string"]
outputs = ["uint"]
