# System, ships with NSIS: <https://nsis.sourceforge.io/System_plug-in>.
#
# See docs/plugin-reference.md. `outputs` is empty on purpose: `System::Call`'s
# count is in its signature, one per `.s`, and the lowering counts it there.

[[plugin]]
name = "System"
method = "call"
nsis = "System::Call"
params = ["string"]
outputs = []
