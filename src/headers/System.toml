# System, which ships with NSIS.

[[plugin]]
name = "System"
method = "call"
nsis = "System::Call"
params = ["string"]
# Empty on purpose, and the one entry whose count is *not* read from here:
# `System::Call`'s outputs are in its signature, one per `.s`, and the lowering
# counts them there. Parsing the rest of a signature — which would narrow the
# clobber set from "everything" — is deferred.
outputs = []
