# AccessControl, third-party: <https://nsis.sourceforge.io/AccessControl_plug-in>.
#
# See docs/plugin-reference.md — read from `AccessControl.cpp`, because the
# readme, the wiki page and the corpus each imply a different set here.
#
# Absent: 23 of the 25 exported methods. The mutators and the `Get*Owner` /
# `Get*Group` readers push one value on success and two on a diagnosed failure;
# `SidToName` pushes two on success and one on a failed lookup. An arity that
# depends on the outcome has no spelling here.

[[plugin]]
name = "AccessControl"
method = "getCurrentUserName"
nsis = "AccessControl::GetCurrentUserName"
params = []
outputs = ["string"]

[[plugin]]
name = "AccessControl"
method = "nameToSid"
nsis = "AccessControl::NameToSid"
params = ["string"]
outputs = ["string"]
