# nsisFirewall, third-party: <https://nsis.sourceforge.io/NsisFirewall_plug-in>.
#
# See docs/plugin-reference.md. Both exported methods are declared.

[[plugin]]
name = "nsisFirewall"
method = "addAuthorizedApplication"
nsis = "nsisFirewall::AddAuthorizedApplication"
params = ["path", "string"]
outputs = ["int"]

[[plugin]]
name = "nsisFirewall"
method = "removeAuthorizedApplication"
nsis = "nsisFirewall::RemoveAuthorizedApplication"
params = ["path"]
outputs = ["int"]
