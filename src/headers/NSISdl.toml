# NSISdl, ships with NSIS: <https://nsis.sourceforge.io/NSISdl_plug-in>.
#
# See docs/plugin-reference.md.

[[plugin]]
name = "NSISdl"
method = "download"
nsis = "NSISdl::download"
params = ["string", "path"]
outputs = ["string"]

[[plugin]]
name = "NSISdl"
method = "downloadQuiet"
nsis = "NSISdl::download_quiet"
params = ["string", "path"]
outputs = ["string"]
