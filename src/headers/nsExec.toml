# nsExec, ships with NSIS: <https://nsis.sourceforge.io/NsExec_plug-in>.
#
# See docs/plugin-reference.md.
#
# Absent: `Exec` and `ExecToLog` (one code each) — undeclared, not undeclarable.

[[plugin]]
name = "nsExec"
method = "execToStack"
nsis = "nsExec::ExecToStack"
params = ["string"]
outputs = ["string", "string"]
