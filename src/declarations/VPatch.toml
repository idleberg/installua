# VPatch, ships with NSIS: `NSISDIR/Docs/VPatch/Readme.html`.
#
# See docs/plugin-reference.md.

[[plugin]]
name = "VPatch"
method = "patchFile"
nsis = "VPatch::vpatchfile"
params = ["path", "path", "path"]
outputs = ["string"]

[[plugin]]
name = "VPatch"
method = "getFileCrc32"
nsis = "VPatch::GetFileCRC32"
params = ["path"]
outputs = ["string"]

[[plugin]]
name = "VPatch"
method = "getFileMd5"
nsis = "VPatch::GetFileMD5"
params = ["path"]
outputs = ["string"]
