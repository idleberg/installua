# TypeLib, ships with NSIS. No shipped doc; counts read from the source,
# `Contrib/Library/TypeLib/TypeLib.cpp`.
#
# See docs/plugin-reference.md.

[[plugin]]
name = "TypeLib"
method = "register"
nsis = "TypeLib::Register"
params = ["path"]
outputs = []

[[plugin]]
name = "TypeLib"
method = "unregister"
nsis = "TypeLib::UnRegister"
params = ["path"]
outputs = []

[[plugin]]
name = "TypeLib"
method = "getLibVersion"
nsis = "TypeLib::GetLibVersion"
params = ["path"]
outputs = ["uint", "uint"]
