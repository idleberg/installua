# Nsis7z, third-party: <https://nsis.sourceforge.io/Nsis7z_plug-in>.
#
# See docs/plugin-reference.md.
#
# Absent: `ExtractWithCallback` — its argument is a function address, and there
# is no `params` type for one; see docs/plugin-reference.md.

[[plugin]]
name = "Nsis7z"
method = "extract"
nsis = "Nsis7z::Extract"
params = ["path"]
outputs = []

[[plugin]]
name = "Nsis7z"
method = "extractWithDetails"
nsis = "Nsis7z::ExtractWithDetails"
params = ["path", "string"]
outputs = []
