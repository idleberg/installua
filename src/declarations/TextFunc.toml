# TextFunc.nsh, ships with NSIS: <https://nsis.sourceforge.io/Docs/AppendixE.html>.
#
# See docs/header-reference.md.
#
# `lineFind`, `fileReadFromEnd`, `textCompare` and `textCompareS` take a
# callback: `params` says only that a function goes there, and the register map
# is behaviour, in `src/lower/callback.rs`.

[[header]]
name = "TextFunc"
method = "lineFind"
nsis = "LineFind"
params = ["path", "path", "string", "callback"]
outputs = []

[[header]]
name = "TextFunc"
method = "fileReadFromEnd"
nsis = "FileReadFromEnd"
params = ["path", "callback"]
outputs = []

[[header]]
name = "TextFunc"
