nsis = "TextCompare"
params = ["path", "path", "string", "callback"]
outputs = []

[[header]]
name = "TextFunc"
method = "textCompareS"
nsis = "TextCompareS"
params = ["path", "path", "string", "callback"]
outputs = []

[[header]]
