# nsExec, ships with NSIS: `NSISDIR/Docs/nsExec/nsExec.txt`.
#
# See docs/plugin-reference.md.
#
# All three flags are declared on every method.

[[plugin]]
name = "nsExec"
method = "execToStack"
nsis = "nsExec::ExecToStack"
params = ["string"]
outputs = ["string", "string"]
flags = [
  { name = "timeout", nsis = "/TIMEOUT", ty = "int", value = "joined" },
  { name = "oem", nsis = "/OEM" },
  { name = "mbcs", nsis = "/MBCS" },
]

[[plugin]]
name = "nsExec"
method = "exec"
nsis = "nsExec::Exec"
params = ["string"]
outputs = ["string"]
flags = [
  { name = "timeout", nsis = "/TIMEOUT", ty = "int", value = "joined" },
  { name = "oem", nsis = "/OEM" },
  { name = "mbcs", nsis = "/MBCS" },
]

[[plugin]]
name = "nsExec"
method = "execToLog"
nsis = "nsExec::ExecToLog"
params = ["string"]
outputs = ["string"]
flags = [
  { name = "timeout", nsis = "/TIMEOUT", ty = "int", value = "joined" },
  { name = "oem", nsis = "/OEM" },
  { name = "mbcs", nsis = "/MBCS" },
]
