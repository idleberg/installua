# AccessControl, third-party: <https://nsis.sourceforge.io/AccessControl_plug-in>.
#
# See docs/plugin-reference.md — read from `AccessControl.cpp`, because the
# readme, the wiki page and the corpus each imply a different set here.
#
# Absent: none of the 25 exported methods. The leading `/noinherit` and `/sid`
# flags have no spelling yet, so the calls they modify are unreachable.

[[plugin]]
name = "AccessControl"
method = "enableFileInheritance"
nsis = "AccessControl::EnableFileInheritance"
params = ["path"]
outputs = ["string"]
tagged = ["error"]
more = ["string"]

