# StartMenu, shipped with NSIS: <https://nsis.sourceforge.io/Docs/StartMenu/Readme.txt>.
#
# See docs/plugin-reference.md — read from `Contrib/StartMenu/StartMenu.c`,
# because the readme's "pushes the folder after success" is a sentence about
# two different arities.

[[plugin]]
name = "StartMenu"
method = "select"
nsis = "StartMenu::Select"
params = ["string"]
outputs = ["string"]
tagged = ["success"]
more = ["string"]
flags = [
  { name = "autoadd", nsis = "/autoadd" },
  { name = "noicon", nsis = "/noicon" },
  { name = "rtl", nsis = "/rtl" },
  { name = "text", nsis = "/text", ty = "string", value = "separate" },
  { name = "lastused", nsis = "/lastused", ty = "string", value = "separate" },
  { name = "checknoshortcuts", nsis = "/checknoshortcuts", ty = "string", value = "separate" },
]

[[plugin]]
name = "StartMenu"
method = "init"
nsis = "StartMenu::Init"
params = ["string"]
outputs = ["handle"]

[[plugin]]
name = "StartMenu"
method = "show"
nsis = "StartMenu::Show"
params = []
outputs = ["string"]
tagged = ["success"]
more = ["string"]
