[tools]
hk = "latest"
pkl = "latest"
python = "latest"

# `rust` is deliberately absent: rust-toolchain.toml pins 1.98 with clippy and
# rustfmt, and rustup honours it. A `rust` entry here would shadow that pin and
# the two would drift. `install:toolchain` below is how mise stays the only tool
# a contributor has to know about — it hands the pin to rustup rather than
# restating it.

[env]
HK_MISE = 1
NSISDIR = '''{{ exec(command="makensis -HDRINFO 2>/dev/null | tr ',' '\n' | grep '^NSISDIR=' | cut -d= -f2 || true") }}'''

[hooks]
postinstall = "hk install --mise && mise run install:toolchain"

# Setup, in dependency order: rustup first — `cargo` is a component of the
# toolchain it installs, so `cargo install` before it is a chicken-and-egg.

[tasks.install]
description = "Installs the pinned toolchain, then `installua` from this checkout"
depends = ["install:toolchain"]
run = "cargo install --path ."

[tasks."install:toolchain"]
description = "rustup toolchain install — reads the pin from rust-toolchain.toml"
# No channel argument on purpose: bare `rustup toolchain install` installs
# whatever rust-toolchain.toml names, components included, so the version lives
# in exactly one file.
run = "rustup toolchain install"

[tasks."install:selene"]
description = "selene, built for Lua 5.4 — the linter `installua init` configures"
# Not a dependency of `install`: nothing in `check` runs selene, it is only
# needed to lint a generated project. The published binary is Lua 5.1, which
# cannot parse the `<const>` a build-time constant is declared with.
run = "cargo install selene --features selene-lib/lua54"

[tasks.build]
description = "Builds the project in release mode"
depends = ["build:release", "build:dll"]

[tasks."build:release"]
description = "Builds the project in release mode"
run = "cargo build --release"

[tasks."build:dll"]
description = "Builds fixture DLL with a version resource"
dir = "tests/fixtures"
run = "python3 make-version-dll.py"

[tasks.check]
description = "The three gates, in the order a failure is cheapest to read"
depends = "build:dll"
run = ["cargo test", "mise run lint", "cargo fmt --check"]

# The two halves hk drives (see hk.pkl): `format` is its `fix`, `lint` its
# `check`. Split out so the pre-commit hook and `check` cannot drift apart.

[tasks.format]
description = "cargo fmt — hk's pre-commit fix step"
run = "cargo fmt"

[tasks.lint]
description = "cargo clippy — hk's pre-commit check step"
run = "cargo clippy --all-targets -- --deny warnings"

[tasks.coverage]
description = "tests/golden/coverage.txt — the command census"
run = "cargo run -q -- coverage > tests/golden/coverage.txt"

[tasks.goldens]
description = "tests/golden/overlay-{examples,attributes}.{lua,nsi}"
run = "cargo test --test overlay -- --ignored write_the_golden"

[tasks.snapshot]
description = "src/table/generated.rs — the -CMDHELP skeletons"
run = [
  "cargo run -q -- generate table tables/cmdhelp-3.12.txt > target/generated.rs",
  "mv target/generated.rs src/table/generated.rs",
  # The generator writes one `Shape` per line and `rustfmt` explodes each into
  # eight; the committed file is the formatted one, so leaving this out makes the
  # task look like it rewrote 4,500 lines every time it ran.
  "cargo fmt",
]
