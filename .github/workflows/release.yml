name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact-name: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact-name: linux-arm64
            use-cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact-name: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact-name: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact-name: windows-x64
            installer: true
          # - target: aarch64-pc-windows-msvc
          #   os: ubuntu-latest
          #   artifact-name: windows-arm64
          #   use-cargo-xwin: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install Rust toolchain
        if: ${{ !matrix.use-cross }}
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.use-cross
        run: cargo install cross

      # - name: Install cargo-xwin
      #   if: matrix.use-cargo-xwin
      #   run: cargo install cargo-xwin

      # - name: Cache xwin MSVC CRT
      #   if: matrix.use-cargo-xwin
      #   uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      #   with:
      #     path: ~/.cache/cargo-xwin
      #     key: cargo-xwin-msvc

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }}

      # - name: Build (cargo-xwin)
      #   if: matrix.use-cargo-xwin
      #   run: cargo xwin build --release --target ${{ matrix.target }}

      # Everything the two cross-compilers above do not: both Macs, Linux x64,
      # and the Windows x64 that also builds the installer. Re-enabling the
      # `cargo-xwin` entry means adding `&& !matrix.use-cargo-xwin` back to this
      # condition — `actionlint` rejects the reference while the entry is
      # commented out, and losing this step is how the last cleanup broke the
      # release.
      - name: Build (native)
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --target ${{ matrix.target }}

      # .cargo/config.toml asks for the static CRT, and nothing fails if it is
      # not honoured — the binary just imports VCRUNTIME140.dll and dies at
      # 0xC0000135 on a clean Windows install, before main, with no message.
      # This is that config, as a check.
      - name: Verify no dynamic CRT dependency
        if: contains(matrix.target, 'windows')
        shell: bash
        run: |
          EXE="./target/${{ matrix.target }}/release/installua.exe"
          if grep -qa 'VCRUNTIME140\|api-ms-win-crt-' "$EXE"; then
            echo "::error::$EXE imports the dynamic CRT; it will fail with 0xC0000135 on a clean Windows install. Check .cargo/config.toml crt-static."
            exit 1
          fi

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create zip
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            BIN=installua.exe
          else
            BIN=installua
          fi
          7z a "installua-${{ steps.version.outputs.VERSION }}-${{ matrix.artifact-name }}.zip" \
            "./target/${{ matrix.target }}/release/${BIN}" LICENSE

      - name: Set up NSIS
        if: matrix.installer
        uses: nsis-dev/setup-nsis@a33839d33d9fb676b90aa455b1a11fb207be059a # v1.1.1

      # Stock NSIS ships no EnVar; setup/install.lua uses it to put INSTDIR on
      # the user's PATH.
      - name: Install EnVar plugin
        if: matrix.installer
        shell: bash
        run: |
          curl -sSLo EnVar.zip https://nsis.sourceforge.io/mediawiki/images/7/7f/EnVar_plugin.zip
          7z x EnVar.zip -oEnVar
          cp EnVar/Plugins/x86-unicode/EnVar.dll "$NSISDIR/Plugins/x86-unicode/"

      - name: Build installer
        if: matrix.installer
        shell: bash
        working-directory: setup
        run: |
          INSTALLUA="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/installua.exe"
          "$INSTALLUA" init
          "$INSTALLUA" stubs
          "$INSTALLUA" build install.lua \
            -D VERSION=${{ steps.version.outputs.VERSION }} \
            -D BINARY=../target/${{ matrix.target }}/release/installua.exe
          mv installua-*-setup.exe "$GITHUB_WORKSPACE/"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installua-${{ matrix.artifact-name }}
          path: installua-*

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum installua-*.zip installua-*-setup.exe > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            installua-*.zip
            installua-*-setup.exe
            SHA256SUMS

  publish-to-crates:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Off until the package exists in winget-pkgs and WINGET_TOKEN is set on this
  # repository; enabling it before either is a failed release. The regex is the
  # NSIS installer rather than the zips ardent publishes — winget wants the
  # thing that installs, and `setup/install.lua` is what produces it.
  # publish-to-winget:
  #   needs: create-release
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Publish to winget-pkgs
  #       uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
  #       with:
  #         identifier: idleberg.installua
  #         installers-regex: '-windows-setup\.exe$'
  #         token: ${{ secrets.WINGET_TOKEN }}
