[package]
name = "installua"
version = "0.1.0"
description = "A Lua-shaped language that compiles to NSIS."
authors = ["Jan T. Sott"]
repository = "https://github.com/idleberg/installua"
readme = "README.md"
keywords = ["nsis", "installer", "compiler"]
categories = ["command-line-utilities", "development-tools", "compilers"]
edition = "2024"
license = "Apache-2.0"
include = [
	"src/**/*.rs",
	"src/declarations/*.toml",
	# `include_str!`d by src/locale.rs and src/mui/mod.rs — the crate does not
	# build without them. cmdhelp-3.12.txt is not here: only tests/census.rs
	# reads it, and it is the largest of the three.
	"tables/locales-3.12.txt",
	"tables/mui-3.12.txt",
	# Leading slash: unanchored, these also match every `README.md` under
	# `node_modules/`, which `include` does not exempt from.
	"/README.md",
	"/LICENSE",
]

[lib]
name = "installua"
path = "src/lib.rs"

[[bin]]
name = "installua"
path = "src/main.rs"

[dependencies]
clark = "0.2.0"
clap ={ version = "4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
full_moon = { version = "2.2.0", default-features = false, features = ["lua54"] }
